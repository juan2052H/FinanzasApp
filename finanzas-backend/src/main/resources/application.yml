server:
  port: ${PORT:8080}

spring:
  application:
    name: finanzas-backend
  datasource:
    url: ${FINANZAS_DB_URL:jdbc:postgresql://localhost:5432/finanzas}
    username: ${POSTGRES_USER:finanzas}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${FINANZAS_MAX_FILE_SIZE:5MB}
      max-request-size: ${FINANZAS_MAX_REQUEST_SIZE:6MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

finanzas:
  jwt:
    secret: ${FINANZAS_JWT_SECRET:dev-only-change-this-secret-before-real-use}
    access-token-minutes: ${FINANZAS_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${FINANZAS_REFRESH_TOKEN_DAYS:14}
  storage:
    root: ${FINANZAS_STORAGE_DIR:./storage}
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${FINANZAS_DB_URL:jdbc:postgresql://localhost:5432/finanzas_test}
  flyway:
    clean-disabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
server:
  forward-headers-strategy: framework
